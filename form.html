
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration Form</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

<header class="header">
    <h1>HİV EVENTS</h1>
    <p>CREATE YOUR MOMENTS</p>
</header>

<main class="container">

    <div class="intro">
        <p class="small-title">YOU ARE INVITED!</p>
        <h2>Event Registration</h2>
        <p>Join us for a wonderful experience.
           Fill in the form below to register.</p>
    </div>

    <form class="registration-form">

        <h3>Personal Information</h3>

        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label for="birthdate">Date of Birth</label>
            <input type="date" id="birthdate">
        </div>

        <div class="form-group">
            <label for="event">Choose Your Event</label>

            <select id="event" required>
                <option value="">Select an event</option>
                <option>Web Design Workshop</option>
                <option>Technology Conference</option>
                <option>Creative Art Workshop</option>
                <option>Photography Day</option>
            </select>
        </div>

        <div class="form-group">
            <label for="eventdate">Preferred Event Date</label>
            <input type="date" id="eventdate" required>
        </div>

        <div class="form-group">

            <label>Gender</label>

            <div class="options">
                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </div>

        </div>

        <div class="form-group">

            <label>What are your interests?</label>

            <div class="options">

                <label>
                    <input type="checkbox" name="interest" value="design">
                    Web Design
                </label>

                <label>
                    <input type="checkbox" name="interest" value="technology">
                    Technology
                </label>

                <label>
                    <input type="checkbox" name="interest" value="art">
                    Art & Creativity
                </label>

                <label>
                    <input type="checkbox" name="interest" value="photography">
                    Photography
                </label>

            </div>

        </div>

        <div class="form-group">
            <label for="message">Additional Message</label>

            <textarea id="message" rows="4"
                placeholder="Write your message here..."></textarea>
        </div>

        <div class="form-group agreement">
            <label>
                <input type="checkbox" required>
                I agree to the registration terms.
            </label>
        </div>

        <button type="submit" class="submit-btn">
            Register Now ♡
        </button>

        <button type="reset" class="reset-btn">
            Clear Form
        </button>

    </form>

</main>

<footer>
    <h3>HİV EVENTS ♡</h3>
    <p>Made with love and creativity.</p>
    <p>© 2026 All Rights Reserved.</p>
</footer>

</body>
</html>
